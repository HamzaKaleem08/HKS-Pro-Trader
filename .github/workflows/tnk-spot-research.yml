name: TNK Public Spot Research
on:
  pull_request:
    paths:
      - 'research/tnk/**'
      - '.github/workflows/tnk-spot-research.yml'
permissions:
  contents: read
jobs:
  tnk-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Check MEXC TNKUSDT Spot candles
        run: python research/tnk/smoke.py
