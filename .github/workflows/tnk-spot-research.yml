name: TNK Public Spot Research
on:
  pull_request:
    paths:
      - 'research/tnk/**'
      - '.github/workflows/tnk-spot-research.yml'
permissions:
  contents: read
jobs:
  tnk-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: TNK 180d trade-by-trade MFE MAE range check
        run: python -u research/tnk/bot2_180d_two_coin_signal_audit.py
