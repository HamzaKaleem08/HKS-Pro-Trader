name: TNK Public Spot Research
on:
  pull_request:
    paths:
      - 'research/tnk/**'
      - '.github/workflows/tnk-spot-research.yml'
permissions:
  contents: read
jobs:
  tnk-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: TNK 180d trade-by-trade MFE MAE range check
        run: python -u research/tnk/archive_recent_1m.py
      - name: Preserve real TNK minute candles as research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnk-mexc-spot-1m-sep25-oct23
          path: tnk_mexc_spot_1m_2026-09-25_to_2026-10-23.csv.gz
          retention-days: 30
