name: Bot 2 Paper Isolation Checks
on:
  pull_request:
    paths:
      - 'app.py'
      - 'bot2_spot.py'
      - 'templates/bot2.html'
      - 'tests/test_bot2_spot.py'
      - '.github/workflows/bot2-paper-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bot2-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile Bot 1 and Bot 2
        run: python -m py_compile app.py bot2_spot.py tests/test_bot2_spot.py
      - name: Test Bot 2 isolated wallet, original trailing, 2 coins, auth
        run: python -m unittest discover -s tests -p test_bot2_spot.py -v
