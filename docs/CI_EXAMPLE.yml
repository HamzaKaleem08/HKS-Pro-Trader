name: Backtester tests
on: [push, pull_request]
jobs:
  local-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests_backtester -v
      - run: node --check backtester/web/app.js
